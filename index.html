<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Style Chat UI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">
  <div class="header">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile">
    <div class="user-info">
      <div class="name">Alice</div>
      <div class="typing">typing...</div>
    </div>
  </div>

  <div class="chat">
    <div class="row left">
      <img class="avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="">
      <div class="msg-box"><div class="msg">Hi</div><div class="time">10:41 PM</div></div>
    </div>
    <div class="row right">
      <div class="msg-box"><div class="msg">Hey!</div><div class="time">10:42 PM • Seen</div></div>
      <img class="avatar" src="https://randomuser.me/api/portraits/women/68.jpg" alt="">
    </div>
    <div class="row left">
      <img class="avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="">
      <div class="msg-box"><div class="msg">How are you?</div><div class="time">10:43 PM</div></div>
    </div>
    <div class="row right">
      <div class="msg-box"><div class="msg">I’m good, u?</div><div class="time">10:44 PM • Seen</div></div>
      <img class="avatar" src="https://randomuser.me/api/portraits/women/68.jpg" alt="">
    </div>
    <div class="row left">
      <img class="avatar" src="https://randomuser.me/api/portraits/men/32.jpg" alt="">
      <div class="msg-box"><div class="msg">Cool</div><div class="time">10:45 PM</div></div>
    </div>
    <div class="row right">
      <div class="msg-box"><div class="msg">😄</div><div class="time">10:46 PM • Seen</div></div>
      <img class="avatar" src="https://randomuser.me/api/portraits/women/68.jpg" alt="">
    </div>
  </div>

  <div class="input">
    <input type="text" placeholder="Message...">
    <div class="send-btn">➤</div>
  </div>
</div>
</body>
</html>
